name: Verify project
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-lock.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: python -m src.data_validation
      - name: Verify published artifact integrity
        run: python -c 'from src.inference import RecommendationService; print(RecommendationService().version)'
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the complete service stack
        run: docker compose up --build -d --wait --wait-timeout 240
      - name: Exercise API, Redis, Streamlit, MLflow and Prometheus
        run: python scripts/smoke_test.py --stack
      - name: Container logs
        if: always()
        run: docker compose logs --no-color --tail=80
      - name: Stop services
        if: always()
        run: docker compose down -v
