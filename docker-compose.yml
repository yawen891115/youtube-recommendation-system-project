services:
  api:
    build: .
    image: youtube-shorts:local
    environment:
      REDIS_URL: redis://redis:6379/0
      REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:-120}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/app/models:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  streamlit:
    image: youtube-shorts:local
    pull_policy: never
    command: ["streamlit", "run", "streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501", "--browser.gatherUsageStats=false"]
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  mlflow:
    image: youtube-shorts:local
    pull_policy: never
    command: ["mlflow", "server", "--backend-store-uri", "sqlite:////app/experiments/mlflow.db", "--default-artifact-root", "/app/experiments/artifacts", "--host", "0.0.0.0", "--port", "5000"]
    volumes:
      - mlflow-data:/app/experiments
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
  prometheus:
    image: prom/prometheus:v3.13.5
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  redis-data:
  mlflow-data:
  prometheus-data:
