[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'youtube-shorts-recommendation'
version = '1.0.0'
description = 'Chronological engagement modeling and a complete recommendation serving demo'
authors = [{name = 'Yawen Zheng'}]
requires-python = '>=3.12'

[tool.setuptools]
packages = ['src']

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['.']

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ['E4', 'E7', 'E9', 'F', 'I']
