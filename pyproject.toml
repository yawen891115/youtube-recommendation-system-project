[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'youtube-shorts-recommendation'
version = '2.0.0'
description = 'Chronological LightGBM LambdaRank video ranking with a monitored five-service serving stack'
authors = [{name = 'Yawen Zheng'}]
requires-python = '>=3.12'

[tool.setuptools]
packages = ['src']

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['.']
filterwarnings = [
    "ignore:The argument 'eval_set' is deprecated",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ['E4', 'E7', 'E9', 'F', 'I']
